<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chess Book Viewer</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.1.1/assets/chessground.base.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.1.1/assets/chessground.brown.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.1.1/assets/chessground.cburnett.css" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #161512;
      color: #bababa;
      font-family: 'Noto Sans', 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      height: 48px;
      min-height: 48px;
      background: #1e1c1a;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 10;
    }

    #topbar .brand {
      font-size: 16px;
      font-weight: 600;
      color: #e8e8e8;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #topbar .brand span {
      color: #629924;
    }

    #open-pdf-btn {
      background: #629924;
      color: #fff;
      border: none;
      padding: 7px 16px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #open-pdf-btn:hover {
      background: #4e7a1a;
    }

    #pdf-file-input {
      display: none;
    }

    /* ── Main split area ── */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── PDF panel ── */
    #pdf-panel {
      width: 50%;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      background: #1a1917;
      overflow: hidden;
      transition: width 0.3s ease;
    }

    #pdf-panel.board-hidden {
      width: 100% !important;
    }

    #pdf-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #555;
      user-select: none;
    }

    #pdf-placeholder svg {
      opacity: 0.3;
    }

    #pdf-placeholder p {
      font-size: 14px;
    }

    #pdf-frame {
      flex: 1;
      border: none;
      display: none;
      background: #fff;
    }

    /* ── Divider ── */
    #divider {
      width: 5px;
      min-width: 5px;
      background: #2e2c2a;
      cursor: col-resize;
      transition: background 0.15s;
      position: relative;
      z-index: 5;
    }

    #divider:hover,
    #divider.dragging {
      background: #629924;
    }

    #divider::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 1px;
      height: 40px;
      background: rgba(255,255,255,0.15);
      border-radius: 2px;
    }

    /* ── Chess panel ── */
    #chess-panel {
      flex: 1;
      min-width: 200px;
      display: flex;
      flex-direction: column;
      background: #161512;
      overflow: hidden;
      padding: 0;
    }

    #chess-ui {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }

    .chess-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .chess-toolbar .panel-toggle {
      background: transparent;
      color: #bababa;
      border: 1px solid #3d3d3d;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .chess-toolbar .panel-toggle:hover {
      background: #2a2826;
      border-color: #629924;
      color: #e8e8e8;
    }

    .chess-toolbar .panel-toggle.is-active {
      border-color: #629924;
      color: #629924;
    }

    .chess-collapsible {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }

    .chess-collapsible.is-open {
      grid-template-rows: 1fr;
    }

    .chess-collapsible-inner {
      overflow: hidden;
      min-height: 0;
    }

    .pgn-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    #pgn-input {
      width: 100%;
      min-height: 64px;
      max-height: 120px;
      resize: vertical;
      background: #262421;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      color: #e8e8e8;
      font-family: inherit;
      font-size: 12px;
      padding: 8px;
    }

    #pgn-input::placeholder {
      color: #666;
    }

    .pgn-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    #load-pgn-btn,
    #load-fen-btn,
    #reset-board-btn,
    #flip-board-btn {
      background: #3d3d3d;
      color: #e8e8e8;
      border: none;
      padding: 6px 12px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #load-pgn-btn:hover,
    #load-fen-btn:hover,
    #reset-board-btn:hover,
    #flip-board-btn:hover {
      background: #629924;
    }

    .chess-toolbar #flip-board-btn {
      margin-left: auto;
    }

    #pgn-status {
      font-size: 12px;
      color: #888;
    }

    #pgn-status.error {
      color: #e58f8f;
    }

    #pgn-status.ok {
      color: #629924;
    }

    .fen-bar {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
      padding-bottom: 2px;
    }

    .fen-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    #fen-input {
      width: 100%;
      background: #262421;
      border: 1px solid #3d3d3d;
      border-radius: 4px;
      color: #e8e8e8;
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
      font-size: 12px;
      padding: 8px;
    }

    #fen-input::placeholder {
      color: #666;
    }

    #fen-status {
      font-size: 12px;
      color: #888;
    }

    #fen-status.error {
      color: #e58f8f;
    }

    #fen-status.ok {
      color: #629924;
    }

    #board-wrap {
      flex: 1;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #board {
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
    }

    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .nav-bar button {
      background: #2e2c2a;
      color: #e8e8e8;
      border: 1px solid #3d3d3d;
      padding: 6px 14px;
      font-size: 14px;
      font-family: inherit;
      border-radius: 4px;
      cursor: pointer;
      min-width: 40px;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-bar button:hover {
      border-color: #629924;
      background: #3a3836;
    }

    .nav-bar button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #move-list {
      max-height: 100px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      color: #bababa;
      padding: 8px 4px 4px;
      border-top: 1px solid #2e2c2a;
    }

    #move-list .move-item {
      display: inline-block;
      padding: 2px 4px;
      margin: 1px;
      border-radius: 3px;
      cursor: pointer;
    }

    #move-list .move-item:hover {
      background: #2e2c2a;
    }

    #move-list .move-item.current {
      background: #629924;
      color: #fff;
    }

    #move-list .move-num {
      color: #666;
      margin-right: 2px;
    }

    /* prevent iframe interaction stealing drag events */
    body.is-dragging iframe {
      pointer-events: none;
    }

    /* ── Panel toggle buttons ── */
    #toggle-board-btn,
    #toggle-pdf-btn {
      background: transparent;
      color: #bababa;
      border: 1px solid #3d3d3d;
      padding: 6px 14px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    #toggle-board-btn:hover,
    #toggle-pdf-btn:hover {
      background: #2a2826;
      border-color: #629924;
      color: #e8e8e8;
    }

    /* ── Smooth board collapse ── */
    #chess-panel {
      transition: flex 0.3s ease, min-width 0.3s ease, padding 0.3s ease;
    }

    #chess-panel.board-hidden {
      flex: 0 0 0px !important;
      min-width: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    #divider {
      transition: width 0.3s ease, min-width 0.3s ease, opacity 0.3s ease;
    }

    #divider.board-hidden,
    #divider.pdf-hidden {
      width: 0 !important;
      min-width: 0 !important;
      opacity: 0;
      pointer-events: none;
    }

    /* ── Smooth PDF collapse ── */
    #pdf-panel.pdf-hidden {
      width: 0 !important;
      min-width: 0 !important;
      overflow: hidden !important;
    }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <div class="brand">
      <span>♟</span> Chess Book Viewer
    </div>
    <button id="toggle-pdf-btn">&#128196; Hide PDF</button>
    <button id="toggle-board-btn">♟ Hide Board</button>
    <button id="open-pdf-btn" onclick="document.getElementById('pdf-file-input').click()">
      Open PDF
    </button>
    <input type="file" id="pdf-file-input" accept=".pdf" />
  </div>

  <!-- Main area -->
  <div id="main">

    <!-- Left: PDF viewer -->
    <div id="pdf-panel">
      <div id="pdf-placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#bababa" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="13" x2="15" y2="13"/>
          <line x1="9" y1="17" x2="15" y2="17"/>
          <line x1="9" y1="9" x2="11" y2="9"/>
        </svg>
        <p>Click <strong>Open PDF</strong> to load your book</p>
      </div>
      <iframe id="pdf-frame" src="about:blank"></iframe>
    </div>

    <!-- Divider -->
    <div id="divider"></div>

    <!-- Right: Chess board -->
    <div id="chess-panel">
      <div id="chess-ui">
        <div class="chess-toolbar">
          <button type="button" class="panel-toggle" id="toggle-pgn-panel-btn">Load PGN</button>
          <button type="button" class="panel-toggle" id="toggle-fen-panel-btn">Load FEN</button>
          <button type="button" class="panel-toggle" id="toggle-moves-panel-btn">Show Moves</button>
          <button type="button" id="reset-board-btn">Reset board</button>
          <button type="button" id="flip-board-btn">Flip board</button>
        </div>
        <div id="pgn-drawer" class="chess-collapsible">
          <div class="chess-collapsible-inner">
            <div class="pgn-bar">
              <textarea id="pgn-input" placeholder="Paste PGN here, then Load PGN…"></textarea>
              <div class="pgn-actions">
                <button type="button" id="load-pgn-btn">Load PGN</button>
                <span id="pgn-status"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="fen-drawer" class="chess-collapsible">
          <div class="chess-collapsible-inner">
            <div class="fen-bar">
              <input type="text" id="fen-input" placeholder="FEN string, e.g. rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" spellcheck="false" autocomplete="off" />
              <div class="fen-actions">
                <button type="button" id="load-fen-btn">Load FEN</button>
                <span id="fen-status"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="board-wrap">
          <div id="board" class="chessground"></div>
        </div>
        <div class="nav-bar">
          <button type="button" id="nav-first" title="Start">|◀</button>
          <button type="button" id="nav-prev" title="Previous">◀</button>
          <button type="button" id="nav-next" title="Next">▶</button>
          <button type="button" id="nav-last" title="End">▶|</button>
        </div>
        <div id="move-drawer" class="chess-collapsible">
          <div class="chess-collapsible-inner">
            <div id="move-list"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    import { Chessground } from 'https://cdn.jsdelivr.net/npm/@lichess-org/chessground@10.1.1/dist/chessground.js';
    import { Chess, validateFen } from 'https://cdn.jsdelivr.net/npm/chess.js@1.2.0/dist/esm/chess.js';

    const defaultStartFen = new Chess().fen();

    // ── PDF loading ──
    document.getElementById('pdf-file-input').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const frame = document.getElementById('pdf-frame');
      const placeholder = document.getElementById('pdf-placeholder');

      frame.src = url;
      frame.style.display = 'block';
      placeholder.style.display = 'none';
    });

    // ── Resizable divider ──
    const divider = document.getElementById('divider');
    const pdfPanel = document.getElementById('pdf-panel');
    const main = document.getElementById('main');

    let isDragging = false;

    divider.addEventListener('mousedown', function (e) {
      isDragging = true;
      divider.classList.add('dragging');
      document.body.classList.add('is-dragging');
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!isDragging) return;

      const mainRect = main.getBoundingClientRect();
      let newWidth = e.clientX - mainRect.left;

      const minWidth = 200;
      const maxWidth = mainRect.width - 200 - divider.offsetWidth;

      newWidth = Math.max(minWidth, Math.min(newWidth, maxWidth));

      pdfPanel.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', function () {
      if (!isDragging) return;
      isDragging = false;
      divider.classList.remove('dragging');
      document.body.classList.remove('is-dragging');
    });

    // ── Board toggle ──
    const toggleBoardBtn = document.getElementById('toggle-board-btn');
    const chessPanel = document.getElementById('chess-panel');
    let boardVisible = true;

    toggleBoardBtn.addEventListener('click', function () {
      boardVisible = !boardVisible;
      chessPanel.classList.toggle('board-hidden', !boardVisible);
      divider.classList.toggle('board-hidden', !boardVisible);
      pdfPanel.classList.toggle('board-hidden', !boardVisible);
      toggleBoardBtn.textContent = boardVisible ? '♟ Hide Board' : '♟ Show Board';
      toggleBoardBtn.style.borderColor = boardVisible ? '#3d3d3d' : '#629924';
      toggleBoardBtn.style.color = boardVisible ? '#bababa' : '#629924';
      if (boardVisible) requestAnimationFrame(() => redrawGround());
    });

    // ── PDF toggle ──
    const togglePdfBtn = document.getElementById('toggle-pdf-btn');
    let pdfVisible = true;

    togglePdfBtn.addEventListener('click', function () {
      pdfVisible = !pdfVisible;
      pdfPanel.classList.toggle('pdf-hidden', !pdfVisible);
      divider.classList.toggle('pdf-hidden', !pdfVisible);
      togglePdfBtn.textContent = pdfVisible ? '\uD83D\uDCC4 Hide PDF' : '\uD83D\uDCC4 Show PDF';
      togglePdfBtn.style.borderColor = pdfVisible ? '#3d3d3d' : '#629924';
      togglePdfBtn.style.color = pdfVisible ? '#bababa' : '#629924';
      if (!pdfVisible) return;
      requestAnimationFrame(() => redrawGround());
    });

    // ── Chessground + chess.js ──
    const boardEl = document.getElementById('board');
    const boardWrap = document.getElementById('board-wrap');
    const pgnInput = document.getElementById('pgn-input');
    const pgnStatus = document.getElementById('pgn-status');
    const fenInput = document.getElementById('fen-input');
    const fenStatus = document.getElementById('fen-status');
    const moveListEl = document.getElementById('move-list');

    let mainLine = [];
    let ply = 0;
    let orientation = 'white';
    let baseFen = defaultStartFen;

    function chessAtPly(plyCount) {
      const chess = new Chess(baseFen);
      for (let i = 0; i < plyCount && i < mainLine.length; i++) {
        chess.move(mainLine[i].san);
      }
      return chess;
    }

    function computeDests(chess) {
      const dests = new Map();
      for (const m of chess.moves({ verbose: true })) {
        if (!dests.has(m.from)) dests.set(m.from, []);
        dests.get(m.from).push(m.to);
      }
      return dests;
    }

    function applyGroundFromChess(chess, lastMove) {
      const dests = computeDests(chess);
      const turnColor = chess.turn() === 'w' ? 'white' : 'black';
      ground.set({
        fen: chess.fen(),
        orientation,
        lastMove: lastMove || undefined,
        check: chess.inCheck(),
        turnColor,
        movable: {
          color: turnColor,
          dests,
          free: false,
          events: {
            after: handleUserMove,
          },
        },
        draggable: { enabled: true },
      });
    }

    function positionAtPly(n) {
      const chess = chessAtPly(n);
      let lastMove;
      if (n > 0 && mainLine[n - 1]) {
        const m = mainLine[n - 1];
        lastMove = [m.from, m.to];
      }
      applyGroundFromChess(chess, lastMove);
    }

    function handleUserMove(orig, dest) {
      const chess = chessAtPly(ply);
      let moveResult = chess.move({ from: orig, to: dest });
      if (!moveResult) {
        moveResult = chess.move({ from: orig, to: dest, promotion: 'q' });
      }
      if (!moveResult) {
        positionAtPly(ply);
        return;
      }
      const hist = chess.history({ verbose: true });
      const added = hist[hist.length - 1];
      mainLine = mainLine.slice(0, ply).concat([added]);
      ply = mainLine.length;
      renderMoveList();
      updateNavButtons();
      positionAtPly(ply);
    }

    const ground = Chessground(boardEl, {
      animation: { duration: 200 },
      premovable: { enabled: false },
      drawable: {
        enabled: true,
        visible: true,
      },
      coordinates: true,
      highlight: {
        lastMove: true,
        check: true,
      },
    });

    positionAtPly(0);

    function redrawGround() {
      if (typeof ground.redrawAll === 'function') ground.redrawAll();
    }

    function setPly(n) {
      ply = Math.max(0, Math.min(n, mainLine.length));
      positionAtPly(ply);
      renderMoveList();
      updateNavButtons();
    }

    function renderMoveList() {
      moveListEl.innerHTML = '';
      for (let i = 0; i < mainLine.length; i++) {
        const m = mainLine[i];
        const span = document.createElement('span');
        span.className = 'move-item' + (i === ply - 1 ? ' current' : '');
        if (i % 2 === 0) {
          const num = document.createElement('span');
          num.className = 'move-num';
          num.textContent = Math.floor(i / 2) + 1 + '.';
          span.appendChild(num);
        }
        span.appendChild(document.createTextNode(m.san + ' '));
        span.addEventListener('click', function () {
          setPly(i + 1);
        });
        moveListEl.appendChild(span);
      }
    }

    function updateNavButtons() {
      document.getElementById('nav-first').disabled = ply <= 0;
      document.getElementById('nav-prev').disabled = ply <= 0;
      document.getElementById('nav-next').disabled = ply >= mainLine.length;
      document.getElementById('nav-last').disabled = ply >= mainLine.length;
    }

    const pgnDrawer = document.getElementById('pgn-drawer');
    const fenDrawer = document.getElementById('fen-drawer');
    const moveDrawer = document.getElementById('move-drawer');
    const togglePgnPanelBtn = document.getElementById('toggle-pgn-panel-btn');
    const toggleFenPanelBtn = document.getElementById('toggle-fen-panel-btn');
    const toggleMovesPanelBtn = document.getElementById('toggle-moves-panel-btn');
    let pgnPanelOpen = false;
    let fenPanelOpen = false;
    let movesPanelOpen = false;

    function refreshBoardLayout() {
      requestAnimationFrame(function () {
        sizeBoard();
      });
    }

    function refreshLayoutAfterDrawerClose(drawerEl) {
      let settled = false;
      function finish() {
        if (settled) return;
        settled = true;
        clearTimeout(fallback);
        drawerEl.removeEventListener('transitionend', onEnd);
        refreshBoardLayout();
      }
      function onEnd(e) {
        if (e.target !== drawerEl) return;
        if (e.propertyName !== 'grid-template-rows') return;
        finish();
      }
      const fallback = setTimeout(finish, 400);
      drawerEl.addEventListener('transitionend', onEnd);
    }

    function closeFenPanel() {
      fenPanelOpen = false;
      fenDrawer.classList.remove('is-open');
      toggleFenPanelBtn.textContent = 'Load FEN';
      toggleFenPanelBtn.classList.remove('is-active');
    }

    function closePgnPanel() {
      pgnPanelOpen = false;
      pgnDrawer.classList.remove('is-open');
      togglePgnPanelBtn.textContent = 'Load PGN';
      togglePgnPanelBtn.classList.remove('is-active');
    }

    function closePgnPanelAfterLoad() {
      if (!pgnPanelOpen) {
        refreshBoardLayout();
        return;
      }
      refreshLayoutAfterDrawerClose(pgnDrawer);
      pgnPanelOpen = false;
      pgnDrawer.classList.remove('is-open');
      togglePgnPanelBtn.textContent = 'Load PGN';
      togglePgnPanelBtn.classList.remove('is-active');
    }

    function closeFenPanelAfterLoad() {
      if (!fenPanelOpen) {
        refreshBoardLayout();
        return;
      }
      refreshLayoutAfterDrawerClose(fenDrawer);
      fenPanelOpen = false;
      fenDrawer.classList.remove('is-open');
      toggleFenPanelBtn.textContent = 'Load FEN';
      toggleFenPanelBtn.classList.remove('is-active');
    }

    function loadPgnFromInput() {
      const text = pgnInput.value.trim();
      pgnStatus.textContent = '';
      pgnStatus.className = '';

      if (!text) {
        pgnStatus.textContent = 'Paste a PGN first.';
        pgnStatus.className = 'error';
        return;
      }

      const chess = new Chess();
      try {
        chess.loadPgn(text, { strict: false });
      } catch (err) {
        pgnStatus.textContent = 'Could not parse PGN.';
        pgnStatus.className = 'error';
        return;
      }

      mainLine = chess.history({ verbose: true });
      while (chess.history().length > 0) {
        chess.undo();
      }
      baseFen = chess.fen();
      pgnStatus.textContent = mainLine.length + ' moves (main line)';
      pgnStatus.className = 'ok';
      setPly(0);
      closePgnPanelAfterLoad();
    }

    document.getElementById('load-pgn-btn').addEventListener('click', loadPgnFromInput);

    function loadFenFromInput() {
      const fenStr = fenInput.value.trim();
      fenStatus.textContent = '';
      fenStatus.className = '';

      if (!fenStr) {
        fenStatus.textContent = 'Enter a FEN string first.';
        fenStatus.className = 'error';
        return;
      }

      const checked = validateFen(fenStr);
      if (!checked.ok) {
        fenStatus.textContent = checked.error || 'Invalid FEN.';
        fenStatus.className = 'error';
        return;
      }

      const chess = new Chess(fenStr);
      baseFen = chess.fen();
      mainLine = [];
      ply = 0;
      applyGroundFromChess(chess, undefined);
      renderMoveList();
      updateNavButtons();
      fenStatus.textContent = 'Position loaded.';
      fenStatus.className = 'ok';
      closeFenPanelAfterLoad();
    }

    document.getElementById('load-fen-btn').addEventListener('click', loadFenFromInput);

    function resetBoardToStart() {
      baseFen = defaultStartFen;
      mainLine = [];
      ply = 0;
      ground.setShapes([]);
      positionAtPly(0);
      renderMoveList();
      updateNavButtons();
      pgnStatus.textContent = '';
      pgnStatus.className = '';
      fenStatus.textContent = '';
      fenStatus.className = '';
    }

    document.getElementById('reset-board-btn').addEventListener('click', resetBoardToStart);

    document.getElementById('flip-board-btn').addEventListener('click', function () {
      orientation = orientation === 'white' ? 'black' : 'white';
      positionAtPly(ply);
    });

    togglePgnPanelBtn.addEventListener('click', function () {
      if (pgnPanelOpen) {
        refreshLayoutAfterDrawerClose(pgnDrawer);
        pgnPanelOpen = false;
        pgnDrawer.classList.remove('is-open');
        togglePgnPanelBtn.textContent = 'Load PGN';
        togglePgnPanelBtn.classList.remove('is-active');
      } else {
        pgnPanelOpen = true;
        closeFenPanel();
        pgnDrawer.classList.add('is-open');
        togglePgnPanelBtn.textContent = 'Hide PGN';
        togglePgnPanelBtn.classList.add('is-active');
        refreshBoardLayout();
      }
    });

    toggleFenPanelBtn.addEventListener('click', function () {
      if (fenPanelOpen) {
        refreshLayoutAfterDrawerClose(fenDrawer);
        fenPanelOpen = false;
        fenDrawer.classList.remove('is-open');
        toggleFenPanelBtn.textContent = 'Load FEN';
        toggleFenPanelBtn.classList.remove('is-active');
      } else {
        fenPanelOpen = true;
        closePgnPanel();
        fenInput.value = chessAtPly(ply).fen();
        fenStatus.textContent = '';
        fenStatus.className = '';
        fenDrawer.classList.add('is-open');
        toggleFenPanelBtn.textContent = 'Hide FEN';
        toggleFenPanelBtn.classList.add('is-active');
        refreshBoardLayout();
      }
    });

    toggleMovesPanelBtn.addEventListener('click', function () {
      movesPanelOpen = !movesPanelOpen;
      moveDrawer.classList.toggle('is-open', movesPanelOpen);
      toggleMovesPanelBtn.textContent = movesPanelOpen ? 'Hide Moves' : 'Show Moves';
      toggleMovesPanelBtn.classList.toggle('is-active', movesPanelOpen);
      refreshBoardLayout();
    });

    document.getElementById('nav-first').addEventListener('click', function () {
      setPly(0);
    });
    document.getElementById('nav-prev').addEventListener('click', function () {
      setPly(ply - 1);
    });
    document.getElementById('nav-next').addEventListener('click', function () {
      setPly(ply + 1);
    });
    document.getElementById('nav-last').addEventListener('click', function () {
      setPly(mainLine.length);
    });

    document.addEventListener('keydown', function (e) {
      const tag = e.target && e.target.tagName;
      if (tag === 'TEXTAREA' || tag === 'INPUT') return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        setPly(ply - 1);
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        setPly(ply + 1);
      } else if (e.key === 'Home') {
        e.preventDefault();
        setPly(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        setPly(mainLine.length);
      }
    });

    function sizeBoard() {
      const w = boardWrap.clientWidth;
      const h = boardWrap.clientHeight;
      const size = Math.max(120, Math.min(w, h) - 4);
      boardEl.style.width = size + 'px';
      boardEl.style.height = size + 'px';
      redrawGround();
    }

    const ro = new ResizeObserver(function () {
      sizeBoard();
    });
    ro.observe(boardWrap);

    window.addEventListener('resize', sizeBoard);
    sizeBoard();
    updateNavButtons();
  </script>

</body>
</html>
